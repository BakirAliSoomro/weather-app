<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="searchbox">
        <img style="height: 20px" src="./assest/location.png.png" alt="" />
        <input type="text" placeholder="Enter The Location" />
        <button><img src="./assest/search.png.png" alt="search" /></button>
      </div>
      <div class="weatherbox">
        <img src="" alt="" />
        <div class="loader hide"></div>
        <div class="temperature"></div>
        <div class="description"></div>
      </div>
      <div class="weatherdetails">
        <div class="humidity">
          <img src="https://img.icons8.com/tiny-glyph/16/dry.png" alt="" />
          <div class="text">
            <span></span>
            <p>humidity</p>
          </div>
        </div>
        <div class="wind">
          <img src="https://img.icons8.com/tiny-bold/16/wind.png" alt="" />
          <div class="text">
            <span></span>
            <p>wind speed</p>
          </div>
        </div>
      </div>
    </div>
    <script src="my.weather.js"></script>
  </body>
</html>
